name: Scrape dining menu

on:
  schedule:
    # Twice daily, in UTC. 13:00 UTC ~ 6am Pacific, 22:00 UTC ~ 3pm Pacific.
    - cron: "0 13 * * *"
    - cron: "0 22 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: scrape-menu
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scraper/requirements.txt

      - name: Install dependencies
        run: pip install -r scraper/requirements.txt

      - name: Scrape menu
        run: python scraper/scrape_menu.py --out menu.json

      - name: Commit menu.json if it changed
        run: |
          if git diff --quiet -- menu.json; then
            echo "menu.json unchanged, nothing to commit."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add menu.json
          git commit -m "menu: update $(python -c 'import json;print(json.load(open("menu.json"))["date"])')"
          git push
